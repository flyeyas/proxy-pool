services:
  proxy_pool:
    build: .
    container_name: proxy_pool
    ports:
      - "5010:5010"
    # 配置统一来自项目根目录 .env(DB_CONN/WEBUI_* 等), 与本地运行共用一份配置
    env_file:
      - .env
    volumes:
      # 日志挂载到宿主机项目目录 log/ 下, 直接在宿主机查看/切割文件
      - ./log:/app/log
    depends_on:
      - proxy_redis
    restart: unless-stopped

  proxy_redis:
    image: redis:alpine
    container_name: proxy_redis
    # 密码来自 .env 的 REDIS_PASSWORD(与 DB_CONN 中保持一致); AOF持久化 + 数据卷
    command: ["redis-server", "--appendonly", "yes",
              "--requirepass", "${REDIS_PASSWORD:-proxypool}"]
    volumes:
      - redis_data:/data
    # 仅发布到宿主机回环地址: 供本机裸跑(python proxyPool.py)连 127.0.0.1:26739, 不暴露公网
    ports:
      - "127.0.0.1:26739:6379"
    restart: unless-stopped

volumes:
  redis_data:
