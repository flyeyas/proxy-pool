version: '2'
services:
  proxy_pool:
    build: .
    container_name: proxy_pool
    ports:
      - "5010:5010"
    links:
      - proxy_redis
    environment:
      DB_CONN: "redis://@proxy_redis:6379/0"
      # WEBUI_USERNAME: "admin"
      # WEBUI_PASSWORD: "change-me"
    volumes:
      # 日志挂载到宿主机项目目录 log/ 下, 直接在宿主机查看/切割文件
      - ./log:/app/log
  proxy_redis:
    image: "redis"
    container_name: proxy_redis
